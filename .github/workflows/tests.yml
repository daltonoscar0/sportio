name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked installs exactly what uv.lock pins rather than re-resolving.
      # pyproject already sets addopts = "-m 'not network'", so the
      # network-marked tests are deselected without anything here.
      - name: Install
        run: uv sync --locked

      # Uses the demo/fixture data committed in the repo. Verified locally:
      # 262 passed, 6 deselected.
      - name: Run tests
        run: uv run pytest
